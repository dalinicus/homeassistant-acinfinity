info:
  name: On Mode
  type: http
  seq: 1

http:
  method: PUT
  url: "{{baseUrl}}/api/dev/modeAndSetting?atType=2&devId={{AI_DEVICE_ID}}&port=1&modeAndSettingIdStr=[16,18]&onSpeed=10"
  headers:
    - name: minversion
      value: "3.5"
    - name: User-Agent
      value: "{{USER_AGENT}}"
  params:
    - name: atType
      value: "2"
      type: query
    - name: devId
      value: "{{AI_DEVICE_ID}}"
      type: query
    - name: port
      value: "1"
      type: query
    - name: modeAndSettingIdStr
      value: "[16,18]"
      type: query
    - name: onSpeed
      value: "10"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
