info:
  name: VPD Mode
  type: http
  seq: 1

http:
  method: PUT
  url: "{{baseUrl}}/api/dev/modeAndSetting?atType=7&devId={{AI_DEVICE_ID}}&port=1&modeAndSettingIdStr=[16,81,32,98,99]&schedStartTime=120&schedEndtTime=350"
  headers:
    - name: minversion
      value: "3.5"
    - name: User-Agent
      value: "{{USER_AGENT}}"
  params:
    - name: atType
      value: "7"
      type: query
    - name: devId
      value: "{{AI_DEVICE_ID}}"
      type: query
    - name: port
      value: "1"
      type: query
    - name: modeAndSettingIdStr
      value: "[16,81,32,98,99]"
      type: query
    - name: schedStartTime
      value: "120"
      type: query
    - name: schedEndtTime
      value: "350"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
