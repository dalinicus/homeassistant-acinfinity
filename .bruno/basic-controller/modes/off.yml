info:
  name: Off Mode
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/api/dev/addDevMode?atType=1&devId={{DEVICE_ID}}&externalPort=1&offSpeed=0"
  params:
    - name: atType
      value: "1"
      type: query
    - name: devId
      value: "{{DEVICE_ID}}"
      type: query
    - name: externalPort
      value: "1"
      type: query
    - name: offSpeed
      value: "0"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
