info:
  name: Schedule Mode
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/api/dev/addDevMode?atType=6&devId={{DEVICE_ID}}&externalPort=1&schedStartTime=120&schedEndtTime=350"
  params:
    - name: atType
      value: "6"
      type: query
    - name: devId
      value: "{{DEVICE_ID}}"
      type: query
    - name: externalPort
      value: "1"
      type: query
    - name: schedStartTime
      value: "120"
      type: query
    - name: schedEndtTime
      value: "350"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
