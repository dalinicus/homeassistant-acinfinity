opencollection: 1.0.0

info:
  name: AC Infinity
config:
  proxy:
    inherit: true
    config:
      protocol: http
      hostname: ""
      port: ""
      auth:
        username: ""
        password: ""
      bypassProxy: ""

request:
  auth:
    type: apikey
    key: token
    value: "{{USER_ID}}"
    placement: header
  variables:
    - name: baseUrl
      value: https://www.acinfinityserver.com
bundled: false
extensions:
  bruno:
    ignore:
      - node_modules
      - .git
